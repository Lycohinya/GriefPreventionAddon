[versions]
kotlin = "2.4.20-Beta1"

paper-api = "26.2.build.+"
minecraft = "26.2"
griefprevention = "16.18.2-SNAPSHOT"
sqlite-jdbc = "3.49.1.0"

shadow = "9.4.3"
run-task = "3.0.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
# 無 Maven Central 發行版;CodeMC 是 GriefPrevention 官方 CI 發布的第三方鏡像(僅 compileOnly,不 shade,執行期用 s01 已裝的正式插件)
griefprevention-api = { module = "com.griefprevention:GriefPrevention", version.ref = "griefprevention" }
# 執行期由 plugin.yml 的 Paper library loader 提供;這裡只給單元測試用,版本要跟 plugin.yml 一致
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }

  card-status-size: "<dark_gray>Size</dark_gray> <color:#f5f5f5>{width} × {height}</color> <color:#a8a8a8>({area} blocks)</color>"
  card-status-center: "<dark_gray>Center</dark_gray> <color:#a8a8a8>{world} ({x}, {z})</color>"

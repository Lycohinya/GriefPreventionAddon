  admin-title: "Claim Settings (Admin) #{claimId}"
  no-permission: "<red>You do not have permission to modify settings for this claim.</red>"
  toggled: "<color:#f5f5f5>Updated <color:#6fd8e8>{setting}</color> to: {state}</color>"

  card-status-title: "<color:#ff8fc4><bold>Claim Status</bold></color> <color:#a8a8a8>#{claimId}</color>"
  card-status-title-named: "<color:#ff8fc4><bold>Claim Status: {alias}</bold></color> <color:#a8a8a8>#{claimId}</color>"

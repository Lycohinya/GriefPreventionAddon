    - ""
    - "<dark_gray>Total Claims</dark_gray> <color:#ffd166>{total}</color>"
    - "<dark_gray>Player Claims</dark_gray> <color:#a7f3d0>{player}</color>"
    - "<dark_gray>Admin Claims</dark_gray> <color:#fca5a5>{admin}</color>"
    - "<dark_gray>Total Area</dark_gray> <color:#6fd8e8>{area}</color> <color:#a8a8a8>blocks</color>"


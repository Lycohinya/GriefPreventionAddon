  btn-teleport-desc-spawn: "<gray>Click to teleport to your custom spawn point</gray>"
  btn-teleport-desc-center: "<gray>Click to teleport to the safe center of this claim</gray>"
  btn-teleport-target: "<dark_gray>Target</dark_gray> <color:#6fd8e8>{target}</color>"
  btn-teleport-coords: "<dark_gray>Coords</dark_gray> <color:#a8a8a8>({world} {x}, {z})</color>"
  btn-teleport-action: "<yellow><bold>Left-Click</bold></yellow><white> Teleport Now</white>"


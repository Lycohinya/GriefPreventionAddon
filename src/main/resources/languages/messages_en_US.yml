  btn-rename-current: "<dark_gray>Current</dark_gray> <color:#ffd166>{alias}</color>"
  btn-rename-current-none: "<dark_gray>Current</dark_gray> <color:#a8a8a8>None (Default #{claimId})</color>"
  btn-rename-benefit: "<dark_gray>Benefit</dark_gray> <color:#6fd8e8>Directly use /ctp <alias> afterwards!</color>"

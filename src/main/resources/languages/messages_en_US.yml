    - "<yellow><bold>Left-Click</bold></yellow><white> Cycle filter (All → Player → Admin)</white>"

  prev-page-name: "<color:#6fd8e8><bold>Previous Page</bold></color>"
  prev-page-lore: "<gray>Go to page {page}</gray>"
  next-page-name: "<color:#6fd8e8><bold>Next Page</bold></color>"

system:
  player-only: "<red>Only in-game players can execute this command.</red>"
  prefix: "<color:#f9a8d4>[Claim]</color> "
  no-permission: "<red>You do not have permission to execute this command or action.</red>"
  invalid-args: "<red>Invalid command arguments. Please check usage format.</red>"

claim:
  gp-missing: "<red>GriefPrevention is not installed or enabled.</red>"
  not-in-claim: "<yellow>You are not standing inside any claim.</yellow>"
  not-owner: "<red>You are not the owner of this claim and cannot modify its settings.</red>"
  save-failed: "<red>Failed to save claim settings. Please contact an administrator.</red>"

tnt:
  allowed: "<color:#f9a8d4>This claim now <color:#6fd8e8><bold>allows</bold></color> TNT explosion block damage.</color>"
  blocked: "<color:#f9a8d4>This claim now <color:#a8a8a8><bold>blocks</bold></color> TNT explosion block damage.</color>"
  status-on: "<color:#f5f5f5>Claim <color:#6fd8e8>#{claimId}</color> TNT explosions are: <color:#6fd8e8><bold>Allowed (Damage Enabled)</bold></color></color>"
  status-off: "<color:#f5f5f5>Claim <color:#6fd8e8>#{claimId}</color> TNT explosions are: <color:#a8a8a8><bold>Protected (Damage Disabled)</bold></color></color>"
  toggled-by-admin: "<color:#a8a8a8>[Admin {admin} updated claim #{claimId} TNT setting to {state}]</color>"

pvp:
  allowed: "<color:#f9a8d4>PvP combat has been <color:#6fd8e8><bold>enabled</bold></color> in this claim. Stay alert!</color>"
  blocked: "<color:#f9a8d4>PvP combat has been <color:#a8a8a8><bold>disabled</bold></color> in this claim. Claim protection restored.</color>"

sethome:
  allowed: "<color:#f9a8d4>This claim now <color:#6fd8e8><bold>allows</bold></color> visitors to use /sethome.</color>"
  blocked: "<color:#f9a8d4>This claim now <color:#a8a8a8><bold>blocks</bold></color> visitors from using /sethome.</color>"
  status-on: "<color:#f5f5f5>Claim <color:#6fd8e8>#{claimId}</color> visitor /sethome is: <color:#6fd8e8><bold>Allowed</bold></color></color>"
  status-off: "<color:#f5f5f5>Claim <color:#6fd8e8>#{claimId}</color> visitor /sethome is: <color:#a8a8a8><bold>Protected (Blocked for visitors)</bold></color></color>"
  blocked-in-claim: "<red>The owner of this claim has not allowed visitors to /sethome here.</red>"

mobs:
  category-on: "<color:#f9a8d4>Natural spawning of {label} is now <color:#6fd8e8><bold>blocked</bold></color> in this claim.</color>"
  category-off: "<color:#f9a8d4>Natural spawning of {label} is now <color:#a8a8a8><bold>allowed</bold></color> in this claim.</color>"
  menu-header: "<color:#f9a8d4><bold>Claim Mob Spawning Toggle</bold></color><color:#a8a8a8> (Click or /cmob <category>)</color>"
  menu-line: "  <click:run_command:/cmob {cmd}><hover:show_text:'<gray>Click to toggle {label}</gray>'>{state} <color:#f5f5f5>{label}</color> <color:#6fd8e8>[/cmob {cmd}]</color></hover></click>"
  state-on: "<color:#6fd8e8>[Blocked]</color>"
  state-off: "<color:#a8a8a8>[Natural]</color>"
  menu-hint: "<color:#a8a8a8>※ Only affects natural spawns. Spawners, eggs, breeding, and commands are unaffected.</color>"
  cat-hostile: "Hostile Mobs (Zombies/Skeletons/Creepers)"
  cat-raider: "Pillager Patrols & Raids"
  cat-phantom: "Phantoms (Insomnia)"
  cat-slime: "Slimes & Magma Cubes"
  cat-ambient: "Ambient (Bats)"

claim-info:
  wilderness: "<yellow>You are currently standing in the wilderness.</yellow>"
  admin-claim: "<color:#f9a8d4><bold>Admin Claim</bold></color> <color:#a8a8a8>({width} × {height}, {area} blocks)</color>"
  owned: "<color:#f9a8d4><bold>{owner}</bold></color><color:#f5f5f5>'s Claim</color> {alias}<color:#a8a8a8>({width} × {height}, {area} blocks)</color>"
  actions: "  <click:run_command:/claimtp {claimId}><hover:show_text:'<gray>Teleport to this claim center</gray>'><color:#6fd8e8><bold>[Teleport]</bold></color></hover></click>   <click:run_command:/csettings {claimId}><hover:show_text:'<gray>Open claim settings GUI</gray>'><color:#f9a8d4><bold>[Settings]</bold></color></hover></click>   <click:suggest_command:'/cname '><hover:show_text:'<gray>Set a custom alias for this claim</gray>'><color:#ffd166><bold>[Set Alias]</bold></color></hover></click>"
  open-gui: "<click:run_command:/csettings><hover:show_text:'<gray>Click to open claim settings menu</gray>'><color:#6fd8e8><bold>[Click to Open Settings]</bold></color></hover></click>"

name:
  guide-header: "<color:#f9a8d4><bold>❀ Claim Alias (Custom Name) Guide</bold></color>"
  guide-current: "  <dark_gray>Current Claim:</dark_gray> <color:#ffd166>{name}</color> <color:#a8a8a8>(#{claimId})</color>"
  guide-current-none: "  <dark_gray>Current Location:</dark_gray> <color:#a8a8a8>Wilderness or not your claim</color>"
  guide-line-set: "  <click:suggest_command:'/cname '><hover:show_text:'<gray>Click to suggest command</gray>'><color:#6fd8e8><bold>[/cname <name>]</bold></color> <gray>Set alias for current claim (e.g. /cname home, /cname farm)</gray></hover></click>"
  guide-line-clear: "  <click:run_command:'/cname clear'><hover:show_text:'<gray>Click to clear alias</gray>'><color:#fca5a5><bold>[/cname clear]</bold></color> <gray>Clear alias of current claim</gray></hover></click>"
  guide-line-id: "  <click:suggest_command:'/cname 1 '><hover:show_text:'<gray>Click to suggest command</gray>'><color:#ffd166><bold>[/cname <id> <name>]</bold></color> <gray>Set alias for a specific claim ID</gray></hover></click>"
  guide-quick-prompt: "  👉 <click:suggest_command:'/cname '><color:#6fd8e8><bold>[Click to type /cname <name>]</bold></color></click>   <click:suggest_command:'/cname home'><color:#ffd166>[/cname home]</color></click>   <click:suggest_command:'/cname farm'><color:#ffd166>[/cname farm]</color></click>   <click:run_command:'/claimslist'><color:#a8a8a8>[View Claims List]</color></click>"
  gui-prompt-header: "<color:#f9a8d4><bold>❀ Enter desired claim alias in chat:</bold></color>"
  gui-prompt-actions: "  Current Claim: <color:#ffd166>{current}</color> (#{claimId})\n  👉 <click:suggest_command:'/cname '><color:#6fd8e8><bold>[Type /cname <alias>]</bold></color></click>   <click:suggest_command:'/cname home'><color:#ffd166>[home]</color></click>   <click:suggest_command:'/cname farm'><color:#ffd166>[farm]</color></click>   <click:run_command:'/cname clear'><color:#fca5a5>[Clear Alias]</color></click>"
  set-success: "<color:#f9a8d4>❀ Successfully set alias of claim <color:#6fd8e8>#{claimId}</color> to: <color:#ffd166><bold>\"{name}\"</bold></color></color>\n  👉 You can now teleport back anytime via <click:run_command:'/ctp {name}'><hover:show_text:'<gray>Click to teleport</gray>'><color:#6fd8e8><bold>/ctp {name}</bold></color></hover></click>!"
  cleared: "<color:#f9a8d4>❀ Cleared custom alias of claim <color:#6fd8e8>#{claimId}</color> (reverted to ID #{claimId}).</color>"
  invalid-name: "<red>Invalid claim alias! Length must be 1-20 characters, cannot be purely numeric, and cannot contain spaces or special symbols.</red>"
  duplicate-name: "<red>Another claim (#{otherId}) owned by you already uses the alias \"{name}\"! Please choose a different name.</red>"
  usage: "<yellow>Usage: /cname <alias> or /cname clear or /cname <claimId> <alias></yellow>"
  list-header: "<color:#f9a8d4><bold>❀ Your Claims List</bold></color><color:#a8a8a8> (Click to teleport)</color>"
  list-entry: "  <click:run_command:/claimtp {target}><hover:show_text:'<gray>Click to teleport to {name}</gray>'><color:#ffd166>❀</color> <color:#ff8fc4><bold>{name}</bold></color> <color:#a8a8a8>(#{claimId} · {width}×{height})</color> <color:#6fd8e8><bold>[Teleport]</bold></color></hover></click>"
  claim-blocks-info: "<color:#a8a8a8>Available Claim Blocks: <color:#ffd166><bold>{remaining}</bold></color> / {total} blocks</color>"

teleport:
  success: "<color:#f9a8d4>❀ Teleported to claim <color:#ffd166><bold>{name}</bold></color> <color:#a8a8a8>(#{claimId})</color> center safe location <color:#a8a8a8>({x}, {y}, {z})</color></color>"
  no-permission: "<red>You are not the owner or a trusted member of this claim and cannot teleport here.</red>"
  no-claims: "<yellow>You do not currently own any claims.</yellow>"
  multiple-claims-hint: "<color:#a8a8a8>You own multiple claims. Use <color:#6fd8e8>/claimtp <name|id></color> to teleport: {claims}</color>"
  invalid-target: "<red>Cannot find claim named \"{target}\" or with ID #{target}! Type /ctp to view list.</red>"
  claim-not-found: "<red>Cannot find claim with ID #{claimId}.</red>"
  success-custom: "<color:#f9a8d4>❀ Teleported to claim <color:#ffd166><bold>{name}</bold></color> <color:#a8a8a8>(#{claimId})</color> custom spawn point <color:#a8a8a8>({x}, {y}, {z})</color></color>"
  failed: "<red>Teleportation failed. The target location may be unsafe.</red>"

spawn:
  set: "<color:#f9a8d4>❀ Custom spawn point set at <color:#6fd8e8>({x}, {y}, {z})</color><color:#a8a8a8> (Claim #{claimId})</color></color>\n  👉 Next time <click:run_command:'/ctp'><hover:show_text:'<gray>Click to test teleport</gray>'><color:#6fd8e8><bold>/ctp</bold></color></hover></click> will take you right here."
  cleared: "<color:#f9a8d4>❀ Custom spawn point for claim <color:#6fd8e8>#{claimId}</color> cleared. /ctp will now use the claim center.</color>"
  already-default: "<color:#a8a8a8>Claim #{claimId} has no custom spawn point set; /ctp already targets the center.</color>"
  outside-claim: "<red>You are standing outside this claim! Spawn points can only be set inside your own claim boundaries.</red>"
  not-in-claim: "<yellow>You are not standing in any claim. Please stand inside your claim and try again.</yellow>"
  help-header: "<color:#f9a8d4><bold>❀ Claim Spawn Point</bold></color><color:#a8a8a8> (Where /ctp lands)</color>"
  help-set: "  <click:run_command:'/cspawn'><hover:show_text:'<gray>Set your current location as spawn</gray>'><color:#6fd8e8><bold>[/cspawn]</bold></color> <gray>Stand at the desired spot and run this</gray></hover></click>"
  help-clear: "  <click:run_command:'/cspawn clear'><hover:show_text:'<gray>Clear custom spawn point</gray>'><color:#fca5a5><bold>[/cspawn clear]</bold></color> <gray>Revert to claim geometric center</gray></hover></click>"


  btn-rename-action: "<yellow><bold>Left-Click</bold></yellow><white> Close GUI and type /cname in chat</white>"

  btn-spawn-name: "<color:#ffb7d5><bold>Claim Spawn Point</bold></color>"
  btn-spawn-desc: "<gray>Configure landing location for /ctp</gray>"
  btn-spawn-current: "<dark_gray>Current</dark_gray> <color:#6fd8e8>({x}, {y}, {z})</color>"
  btn-spawn-outside: "<dark_gray>Current</dark_gray> <color:#fca5a5>Outside claim boundary (falls back to center)</color>"
  btn-spawn-none: "<dark_gray>Current</dark_gray> <color:#a8a8a8>Default (Geometric Center)</color>"
  btn-spawn-howto: "<dark_gray>How-to</dark_gray> <color:#a8a8a8>Stand at spot and click here or use /cspawn</color>"
  btn-spawn-action-set: "<yellow><bold>Left-Click</bold></yellow><white> Set spawn to your current location</white>"
  btn-spawn-action-clear: "<yellow><bold>Right-Click</bold></yellow><white> Clear spawn and revert to center</white>"

  btn-admin-panel-name: "<color:#fca5a5><bold>Server Claims Admin Panel</bold></color>"
  btn-admin-panel-desc: "<gray>Manage and inspect all server claims</gray>"
  btn-admin-panel-uuid: "<dark_gray>Owner UUID</dark_gray> <color:#a8a8a8>{uuid}</color>"
  btn-admin-panel-text: "<dark_gray>Admin</dark_gray> <color:#6fd8e8>Open global claims management panel (/cadmin)</color>"
  btn-admin-panel-action: "<yellow><bold>Left-Click</bold></yellow><white> Open global claims admin panel</white>"

  footer-help-name: "<color:#ffb7d5><bold>Claim Settings Help</bold></color>"
  footer-help-lore:
    - "<gray>Settings apply in real-time across this claim</gray>"
    - ""
    - "<dark_gray>Permission</dark_gray> <white>Only owner or admin can edit</white>"
    - "<dark_gray>Shortcuts</dark_gray> <white>/ctp, /cname, /ctnt, /pvp, /csethome, /cmob</white>"

  footer-close-name: "<color:#a8a8a8><bold>Close Menu</bold></color>"
  footer-close-action: "<yellow><bold>Left-Click</bold></yellow><white> Close this interface</white>"

settings:
  current-status: "<dark_gray>Status</dark_gray> {state}"
  action-hint: "<yellow><bold>Left-Click</bold></yellow><white> {action}</white>"

  tnt:
    name: "TNT Explosion Damage"
    desc: "Controls whether TNT explosions can break blocks in this claim"
    enabled: "<color:#6fd8e8>[Allowed (Damage On)]</color>"
    disabled: "<color:#a8a8a8>[Blocked (Protected)]</color>"
    action-enable: "Toggle to allow TNT damage"
    action-disable: "Toggle to protect blocks from TNT"

  pvp:
    name: "Claim PvP Combat"
    desc: "Controls whether players can engage in PvP combat in this claim"
    enabled: "<color:#6fd8e8>[PvP Enabled]</color>"
    disabled: "<color:#a8a8a8>[PvP Disabled (Protected)]</color>"
    action-enable: "Enable PvP combat"
    action-disable: "Disable PvP combat (Restore protection)"

  sethome:
    name: "Guest /sethome Permission"
    desc: "Controls whether untrusted visitors can use /sethome in this claim"
    enabled: "<color:#6fd8e8>[Allowed for Visitors]</color>"
    disabled: "<color:#a8a8a8>[Blocked for Visitors (Protected)]</color>"
    action-enable: "Allow visitors to /sethome"
    action-disable: "Block visitors from /sethome"

  mob-hostile:
    name: "Hostile Mobs"
    desc: "Blocks natural spawning of Zombies, Skeletons, Creepers, etc."
    enabled: "<color:#6fd8e8>[Spawning Blocked]</color>"
    disabled: "<color:#a8a8a8>[Natural Spawning]</color>"
    action-enable: "Block natural spawning"
    action-disable: "Restore natural spawning"

  mob-raider:
    name: "Pillager Patrols & Raids"
    desc: "Blocks natural spawning of Pillager Patrols and Raid parties"
    enabled: "<color:#6fd8e8>[Spawning Blocked]</color>"
    disabled: "<color:#a8a8a8>[Natural Spawning]</color>"
    action-enable: "Block natural spawning"
    action-disable: "Restore natural spawning"

  mob-phantom:
    name: "Phantoms (Insomnia)"
    desc: "Blocks natural spawning of Phantoms above this claim"
    enabled: "<color:#6fd8e8>[Spawning Blocked]</color>"
    disabled: "<color:#a8a8a8>[Natural Spawning]</color>"
    action-enable: "Block natural spawning"
    action-disable: "Restore natural spawning"

  mob-slime:
    name: "Slimes & Magma Cubes"
    desc: "Blocks natural spawning and splitting of Slimes & Magma Cubes"
    enabled: "<color:#6fd8e8>[Spawning Blocked]</color>"
    disabled: "<color:#a8a8a8>[Natural Spawning]</color>"
    action-enable: "Block natural spawning"
    action-disable: "Restore natural spawning"

  mob-ambient:
    name: "Ambient Creatures (Bats)"
    desc: "Blocks natural spawning of bats and ambient creatures"
    enabled: "<color:#6fd8e8>[Spawning Blocked]</color>"
    disabled: "<color:#a8a8a8>[Natural Spawning]</color>"
    action-enable: "Block natural spawning"
    action-disable: "Restore natural spawning"

admin:
  list-title: "Claims Management ({page}/{totalPages})"
  no-claims: "<yellow>There are currently no claims registered on the server.</yellow>"
  claim-deleted: "<color:#fca5a5>Force deleted claim #{claimId} and purged all associated data.</color>"
  teleported: "<color:#a8a8a8>[Admin] Teleported to claim #{claimId} center.</color>"
  help: "<color:#f9a8d4><bold>Admin Claims Management Commands:</bold></color>\n  <color:#6fd8e8>/cadmin</color> <gray>Open global claims management GUI</gray>\n  <color:#6fd8e8>/cadmin list [player]</color> <gray>List claims by player or all</gray>\n  <color:#6fd8e8>/cadmin tp <id|alias></color> <gray>Force teleport to any claim</gray>\n  <color:#6fd8e8>/cadmin delete <id></color> <gray>Force delete a claim</gray>\n  <color:#6fd8e8>/cadmin name <id> <alias|clear></color> <gray>Set or clear alias of any claim</gray>\n  <color:#6fd8e8>/cadmin set <id> <setting> <true|false></color> <gray>Force change claim setting</gray>"

  card-title: "<color:#ff8fc4><bold>Claim #{claimId}</bold></color>"
  card-title-named: "<color:#ff8fc4><bold>Claim #{claimId}</bold></color> <color:#ffd166>\"{alias}\"</color>"
  card-type-admin: "<color:#fca5a5>Admin Claim</color>"
  card-type-sub: "<color:#6fd8e8>Subdivision</color>"
  card-type-player: "<color:#a7f3d0>Player Claim</color>"
  card-lore:
    - "<dark_gray>Type</dark_gray> {type}"
    - "<dark_gray>Owner</dark_gray> <color:#f5f5f5>{owner}</color>"
    - "<dark_gray>Size</dark_gray> <color:#f5f5f5>{width} × {height}</color> <color:#a8a8a8>({area} blocks)</color>"
    - "<dark_gray>Location</dark_gray> <color:#a8a8a8>{world} ({x}, {z})</color>"

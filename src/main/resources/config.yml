# GriefPreventionAddon Configuration
# Multi-feature companion for GriefPrevention with TNT control, Guest SetHome permission, Mobs filter, GUI management, and i18n localization.

locale:
  # Default language for server console, broadcasts, and fallback (e.g. zh_TW, en_US)
  default-language: "zh_TW"
  # Whether to automatically match and render messages according to the player's Minecraft client locale
  auto-detect-client-locale: true

tnt:
  # Default claim TNT explosion block damage setting (false = protect blocks from explosions)
  default-allowed: false

pvp:
  # Default claim PvP combat setting (false = protected by GriefPrevention)
  default-allowed: false

sethome:
  # Default guest /sethome setting (false = only claim owners and trusted players can /sethome)
  default-allowed: false

migration:
  # Automatically migrate legacy claim_toggle records from LycoServerTweaks if present
  auto-migrate-lst: true
  lst-db-path: "../LycoServerTweaks/data.db"

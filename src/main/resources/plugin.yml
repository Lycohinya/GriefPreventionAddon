name: GriefPreventionAddon
description: $description
prefix: GriefPreventionAddon
version: '${version}'

main: com.tinyyana.griefPreventionAddon.GriefPreventionAddonPlugin
api-version: '26.2'
load: POSTWORLD

folia-supported: true

authors: [ TinyYana ]
website: https://tinyyana.com

libraries:
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20-Beta1

# 選單引擎硬依賴——沒裝 LycoLib 就無法啟動(比照 LycoQuest)
depend: [ LycoLib ]
softdepend: [ GriefPrevention ]

commands:
  ctnt:
    description: Set TNT block damage for the claim or subdivision you stand in
    aliases: [ claimtnt ]
    usage: /ctnt [on|off|inherit|status]
  csettings:
    description: Open the claim menu (overview, rules, members, management)
    aliases: [ claimsettings, cmenu, claimgui ]
    usage: /csettings [claimId|alias]
  pvpinclaim:
    description: Set PvP for the claim or subdivision you stand in
    aliases: [ pvp, cpvp, pvpc ]
    usage: /pvp [on|off|inherit|status]
  csethome:
    description: Set whether trusted members / untrusted visitors can use /sethome in the claim or subdivision you stand in
    aliases: [ claimsethome, sethomeinclaim ]
    usage: /csethome [trusted|visitor] [on|off|inherit|status]
  claimmobs:
    description: Set natural mob spawning (hostile, raider, phantom, slime, ambient) for the claim or subdivision you stand in
    aliases: [ cmob ]
    usage: /cmob [hostile|raider|phantom|slime|ambient] [on|off|inherit]
  claimfire:
    description: Set fire spread / fire block damage for the claim or subdivision you stand in
    aliases: [ cfire ]
    usage: /cfire [spread|burn] [on|off|inherit]
  claiminfo:
    description: Query claim information, owner, and settings at your current location
    usage: /claiminfo
  claimtp:
    description: Teleport to your claim or a specified claim center/spawn point
    aliases: [ ctp, claimteleport ]
    usage: /claimtp [alias|claimId]
  claimname:
    description: Set or clear a custom alias for your claim
    aliases: [ cname, claimalias, calias ]
    usage: /cname [alias|clear]
  claimspawn:
    description: Set your current position as the custom spawn point for /ctp
    aliases: [ cspawn, claimpoint, csetspawn ]
    permission: griefpreventionaddon.spawn
    usage: /cspawn [set|clear]
  claimslist:
    description: List all claims owned by you with click-to-teleport shortcuts
    aliases: [ claims, myclaims ]
    usage: /claimslist
  claimadmin:
    description: Global claims management panel and administrative tools
    aliases: [ cadmin, cmanage ]
    permission: griefpreventionaddon.admin
    usage: /cadmin [list|tp|delete|name|set <id> <key> <allow|deny|inherit>|help]

permissions:
  griefpreventionaddon.user:
    description: Basic claim settings and query permissions for owned claims
    default: true
  griefpreventionaddon.tnt:
    description: Toggle TNT setting in owned claims via /ctnt
    default: true
  griefpreventionaddon.tnt.others:
    description: Toggle TNT setting in claims owned by others
    default: op
  griefpreventionaddon.tnt.view:
    description: View TNT status in any claim
    default: true
  griefpreventionaddon.sethome:
    description: Toggle visitor /sethome setting in owned claims via /csethome
    default: true
  griefpreventionaddon.sethome.others:
    description: Toggle visitor /sethome setting in claims owned by others, or bypass guest restrictions
    default: op
  griefpreventionaddon.tp:
    description: Teleport to owned claims via /ctp
    default: true
  griefpreventionaddon.tp.others:
    description: Teleport to claims owned by others
    default: op
  griefpreventionaddon.tp.admin:
    description: Teleport to admin claims
    default: op
  griefpreventionaddon.spawn:
    description: Set custom claim spawn point via /cspawn
    default: true
  griefpreventionaddon.settings.others:
    description: Modify settings in claims owned by others
    default: op
  griefpreventionaddon.admin:
    description: Full administrative permissions for GriefPreventionAddon
    default: op
